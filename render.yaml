services:
  - type: web
    name: payguard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PAYGUARD_DATABASE_PATH
        value: /var/data/payguard-demo.sqlite3
      - key: PAYGUARD_COOKIE_SECURE
        value: "true"
      - key: PAYGUARD_COOKIE_SAMESITE
        value: none
      - key: PAYGUARD_CORS_ORIGINS
        sync: false
      - key: BHARATCODE_API_KEY
        sync: false
      - key: BHARATCODE_BASE_URL
        value: https://bharatcode.ai/api/model/v1
      - key: BHARATCODE_MODEL
        value: qwen-3.8-27b
      - key: TESSERACT_LANG
        value: eng
    disk:
      name: payguard-data
      mountPath: /var/data
      sizeGB: 1
